<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stavební Aplikace - Uživatelská dokumentace</title>
    <style>
        @media print {
            @page {
                margin: 2cm;
                size: A4;
            }
            body {
                font-size: 10pt;
            }
            h1 {
                page-break-before: always;
            }
            h1:first-of-type {
                page-break-before: avoid;
            }
            pre, table {
                page-break-inside: avoid;
            }
            img {
                max-width: 100%;
                page-break-inside: avoid;
            }
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 210mm;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
        }
        
        h1 {
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
            padding-bottom: 10px;
            margin-top: 40px;
        }
        
        h2 {
            color: #1e40af;
            margin-top: 30px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 5px;
        }
        
        h3 {
            color: #1e3a8a;
            margin-top: 20px;
        }
        
        h4 {
            color: #334155;
            margin-top: 15px;
        }
        
        code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        
        pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
        }
        
        th, td {
            border: 1px solid #e5e7eb;
            padding: 12px;
            text-align: left;
        }
        
        th {
            background: #f3f4f6;
            font-weight: 600;
        }
        
        tr:nth-child(even) {
            background: #f9fafb;
        }
        
        blockquote {
            border-left: 4px solid #2563eb;
            margin: 20px 0;
            padding: 10px 20px;
            background: #eff6ff;
        }
        
        ul, ol {
            margin: 15px 0;
            padding-left: 30px;
        }
        
        li {
            margin: 5px 0;
        }
        
        a {
            color: #2563eb;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        .cover-page {
            text-align: center;
            padding: 100px 0;
            page-break-after: always;
        }
        
        .cover-page h1 {
            font-size: 3em;
            border: none;
            margin-bottom: 20px;
        }
        
        .cover-page .subtitle {
            font-size: 1.5em;
            color: #64748b;
            margin-bottom: 50px;
        }
        
        .cover-page .version {
            font-size: 1.2em;
            color: #94a3b8;
        }
        
        .print-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .print-button:hover {
            background: #1e40af;
        }
        
        @media print {
            .print-button {
                display: none;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <button class="print-button" onclick="window.print()">🖨️ Vytisknout/Uložit jako PDF</button>
    
    <div class="cover-page">
        <h1>Stavební Aplikace</h1>
        <div class="subtitle">Uživatelská dokumentace</div>
        <div class="version">Verze 1.0 | Leden 2026</div>
    </div>
    
    <div id="content"></div>
    
    <script>
        // Načtení markdown souboru
        fetch('UZIVATELSKA_DOKUMENTACE.md')
            .then(response => response.text())
            .then(markdown => {
                // Konverze markdown na HTML
                const html = marked.parse(markdown);
                document.getElementById('content').innerHTML = html;
            })
            .catch(error => {
                console.error('Chyba při načítání dokumentace:', error);
                document.getElementById('content').innerHTML = '<p style="color: red;">Chyba při načítání dokumentace. Soubor UZIVATELSKA_DOKUMENTACE.md nebyl nalezen.</p>';
            });
    </script>
</body>
</html>
