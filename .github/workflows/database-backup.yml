name: Database Backup

on:
  schedule:
    # Každou neděli ve 3:00 UTC (4:00 CET)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Umožňuje manuální spuštění

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
      
      - name: Create backup
        env:
          DB_HOST: ${{ secrets.RAILWAY_DB_HOST }}
          DB_PORT: ${{ secrets.RAILWAY_DB_PORT }}
          DB_USER: ${{ secrets.RAILWAY_DB_USER }}
          DB_PASSWORD: ${{ secrets.RAILWAY_DB_PASSWORD }}
          DB_NAME: ${{ secrets.RAILWAY_DB_NAME }}
        run: |
          # Check if secrets are configured
          if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ] || [ -z "$DB_NAME" ]; then
            echo "❌ ERROR: Railway database secrets are not configured!"
            echo "Please add the following secrets to your GitHub repository:"
            echo "  - RAILWAY_DB_HOST"
            echo "  - RAILWAY_DB_PORT"
            echo "  - RAILWAY_DB_USER"
            echo "  - RAILWAY_DB_PASSWORD"
            echo "  - RAILWAY_DB_NAME"
            echo ""
            echo "Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          
          BACKUP_FILE="backup_$(date +%Y%m%d_%H%M%S).sql"
          echo "Creating backup: ${BACKUP_FILE}"
          
          mysqldump -h "${DB_HOST}" -P "${DB_PORT}" -u "${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" > "${BACKUP_FILE}"
          
          if [ $? -ne 0 ]; then
            echo "❌ mysqldump failed!"
            exit 1
          fi
          
          # Komprese
          gzip "${BACKUP_FILE}"
          
          echo "✅ Backup created: ${BACKUP_FILE}.gz"
          echo "BACKUP_FILE=${BACKUP_FILE}.gz" >> $GITHUB_ENV
      
      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: backup_*.sql.gz
          retention-days: 90
      
      - name: Clean old artifacts (keep last 12 backups)
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            const backupArtifacts = artifacts.data.artifacts
              .filter(a => a.name.startsWith('database-backup-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            // Smaž starší než 12. záloha
            for (let i = 12; i < backupArtifacts.length; i++) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: backupArtifacts[i].id
              });
              console.log(`Deleted backup: ${backupArtifacts[i].name}`);
            }
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Database backup failed!" 
          # Zde můžete přidat email notifikaci
